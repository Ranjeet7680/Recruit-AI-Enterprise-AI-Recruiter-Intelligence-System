ai_usage_summary: |
  Used Gemini for code optimization, data analysis, and honeypot criteria identification.
  Used GitHub Copilot for code completion and structure.
  No candidate data was shared with any external LLM during execution.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Highly optimized hybrid rule-based and keyword-based ranker. First, 70 honeypots are strictly filtered using logical anomalies (expert skills with 0 duration, history-YoE mismatches). Second, keyword-stuffer profiles (e.g., non-technical titles with stuffed skills) are penalized. Third, scoring evaluates YoE alignment (5-9 years sweet spot), title relevance, skill duration/proficiency weighting, and semantic keywords. Fourth, locations in India and sub-30 day notice periods are prioritized. Finally, recruiter response rate and recency multipliers are applied. The pipeline runs dynamically in under 20 seconds on a single CPU.

